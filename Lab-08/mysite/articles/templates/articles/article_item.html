{% extends 'base_layout.html' %}

{% block title %}
    {{ article.title }}
{% endblock title %}

{% block content %}

<main>
    <div class="article-detail">

        {% if article.thumbnail %}
            <img
                src="{{ article.thumbnail.url }}"
                alt="{{ article.title }}"
                class="article-image"
            >
        {% endif %}

        <h1>{{ article.title }}</h1>

        <p>{{ article.body }}</p>

        <p>
            <a href="{% url 'article_list' %}">
                Вернуться к списку статей
            </a>
        </p>

    </div>
</main>

{% endblock content %}
