{% extends 'base_layout.html' %}

{% block title %}
    Регистрация
{% endblock title %}

{% block content %}

<main>
    <div class="article-detail">

        <h1>Регистрация пользователя</h1>

        <form action="{% url 'signup' %}" method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                Зарегистрироваться
            </button>

        </form>

    </div>
</main>

{% endblock content %}
