{% extends 'base_layout.html' %}

{% block title %}
Вход в систему
{% endblock title %}

{% block content %}

<main>
    <div class="auth-container">

        <h1>Вход в аккаунт</h1>

        <p>
            Авторизуйтесь, чтобы продолжить
            работу с сайтом статей.
        </p>

        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Войти
            </button>
        </form>

        <p class="auth-link">
            Нет аккаунта?
            <a href="{% url 'signup' %}">
                Зарегистрироваться
            </a>
        </p>

    </div>
</main>

{% endblock content %}
