{% extends 'base_layout.html' %}

{% block title %}
    Вход в систему
{% endblock title %}

{% block content %}

<main>
    <div class="article-detail">

        <h1>Вход в систему</h1>

        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Войти
            </button>
        </form>

        <p>
            Нет аккаунта?
            <a href="{% url 'signup' %}">Зарегистрироваться</a>
        </p>

    </div>
</main>

{% endblock content %}
